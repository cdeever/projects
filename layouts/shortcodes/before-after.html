{{ $before := .Get "before" }}
{{ $after := .Get "after" }}
{{ $id := delimit (shuffle (seq 1 9)) "" | truncate 8 "" }}

<div class="before-after-{{ $id }}" style="position:relative; max-width:700px; margin:1.5rem auto; overflow:hidden;">
  <img src="{{ $before }}" alt="Before" style="display:block; width:100%; height:auto;">
  <img src="{{ $after }}" alt="After" class="before-after-top-{{ $id }}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
</div>

<style>
  .before-after-top-{{ $id }} {
    animation: crossfade-{{ $id }} 9s ease-in-out infinite;
  }
  @keyframes crossfade-{{ $id }} {
    0%   { opacity: 0; }
    17%  { opacity: 0; }  /* hold before 0–1.5s */
    33%  { opacity: 1; }  /* fade to after 1.5–3s */
    67%  { opacity: 1; }  /* hold after 3–6s */
    83%  { opacity: 0; }  /* fade back 6–7.5s */
    100% { opacity: 0; }  /* hold before 7.5–9s */
  }
</style>
