<div class="max-w-6xl mx-auto px-4 py-6">
  <div class="mb-6 text-center">
    <h1 class="text-4xl font-bold mb-3">{{ .Site.Title }}</h1>
    {{ with .Content }}
      <div class="prose dark:prose-invert mx-auto">
        {{ . }}
      </div>
    {{ end }}
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
    {{ range where .Site.Sections "Kind" "section" }}
      {{ if ne .Params.hidden true }}
        <a href="{{ .RelPermalink }}" class="group flex items-center gap-3 rounded-lg border border-neutral-200 dark:border-neutral-700 p-4 hover:shadow-lg transition-shadow duration-200 bg-neutral-50 dark:bg-neutral-800">
          {{ with .Params.icon }}
            <span class="shrink-0 w-8 h-8 text-primary-600 dark:text-primary-400">
              {{ partial "icon.html" . }}
            </span>
          {{ end }}
          <div class="min-w-0">
            <h2 class="text-base font-semibold group-hover:text-primary-600 dark:group-hover:text-primary-400 transition-colors">{{ .Title }}</h2>
            {{ with .Description }}
              <p class="text-xs text-neutral-600 dark:text-neutral-400 line-clamp-1">{{ . }}</p>
            {{ end }}
          </div>
        </a>
      {{ end }}
    {{ end }}
  </div>
</div>
